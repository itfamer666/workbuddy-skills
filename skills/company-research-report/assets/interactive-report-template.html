<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{COMPANY}} · 交互式研究报告</title>
<style>
:root{
  --blue:#185FA5; --blue-d:#0C447C; --blue-l:#E6F1FB;
  --teal:#0F6E56; --teal-l:#E1F5EE;
  --amber:#854F0B; --amber-l:#FAEEDA;
  --purple:#534AB7; --purple-l:#EEEDFE;
  --red:#A32D2D; --red-l:#FCE9E9;
  --ink:#1a1a1a; --sub:#5f5e5a; --mute:#949490;
  --line:#e4e4e0; --bg:#f5f7f9; --card:#ffffff; --soft:#fafbfc;
  --shadow:0 1px 3px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.05);
}
html[data-theme="dark"]{
  --ink:#e8e8e6; --sub:#a8a8a2; --mute:#7e7e78;
  --line:#2e3238; --bg:#14171b; --card:#1c2026; --soft:#22272e;
  --blue:#6EA8E8; --blue-d:#8FBFEF; --blue-l:#1b2c42;
  --teal:#5FC9A8; --teal-l:#14312a; --amber:#E0B25C; --amber-l:#332a15;
  --purple:#A79BE8; --purple-l:#262142; --red:#E88A8A; --red-l:#3a1f1f;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.75;font-size:15px;transition:background .3s,color .3s;}
#prog{position:fixed;top:0;left:0;height:3px;width:0;z-index:1000;
  background:linear-gradient(90deg,var(--blue),#4A9AE0);transition:width .1s linear;}
.layout{display:grid;grid-template-columns:236px 1fr;max-width:1280px;margin:0 auto;}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;padding:26px 14px 40px 22px;border-right:1px solid var(--line);}
.main{padding:26px 34px 100px;min-width:0;}
.side .brand{font-weight:800;font-size:15px;line-height:1.35;margin-bottom:4px;}
.side .brand em{display:block;font-style:normal;font-size:11.5px;color:var(--mute);font-weight:500;letter-spacing:.5px;}
.side nav{margin-top:18px;}
.side nav a{display:block;padding:7px 11px;border-radius:8px;color:var(--sub);text-decoration:none;
  font-size:13.5px;margin-bottom:2px;transition:.18s;border-left:3px solid transparent;}
.side nav a:hover{background:var(--soft);color:var(--ink);}
.side nav a.on{background:var(--blue-l);color:var(--blue);font-weight:700;border-left-color:var(--blue);}
.side nav a i{display:inline-block;width:20px;font-style:normal;color:var(--mute);font-size:11px;}
.side nav a.on i{color:var(--blue);}
.side .tools{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;}
.btn{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:8px;
  padding:6px 11px;font-size:12.5px;cursor:pointer;transition:.18s;font-family:inherit;}
.btn:hover{border-color:var(--blue);color:var(--blue);}
.hero{background:linear-gradient(135deg,var(--blue-d),var(--blue) 60%,#3B86C8);color:#fff;
  border-radius:18px;padding:34px 36px;margin-bottom:24px;position:relative;overflow:hidden;}
.hero::after{content:'';position:absolute;right:-70px;top:-70px;width:280px;height:280px;border-radius:50%;
  background:rgba(255,255,255,.07);}
.hero .ey{font-size:11.5px;letter-spacing:2.5px;opacity:.8;text-transform:uppercase;}
.hero h1{margin:8px 0 6px;font-size:31px;line-height:1.28;}
.hero p{margin:0;opacity:.9;font-size:14.5px;max-width:760px;position:relative;z-index:1;}
.hero .chips{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1;}
.hero .chips span{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);
  padding:4px 12px;border-radius:20px;font-size:12.5px;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px;text-align:center;
  box-shadow:var(--shadow);transition:.2s;}
.kpi:hover{transform:translateY(-3px);border-color:var(--blue);}
.kpi .n{font-size:27px;font-weight:800;color:var(--blue);line-height:1.15;font-variant-numeric:tabular-nums;}
.kpi .n small{font-size:14px;font-weight:700;}
.kpi .l{font-size:12.5px;color:var(--sub);margin-top:3px;}
.kpi .s{font-size:10.5px;color:var(--mute);margin-top:5px;}
section{scroll-margin-top:20px;margin-bottom:34px;}
h2{font-size:22px;margin:0 0 16px;padding-left:13px;border-left:5px solid var(--blue);line-height:1.35;}
h2 .num{font-size:12px;color:var(--mute);font-weight:500;}
h3{font-size:16.5px;margin:22px 0 10px;color:var(--blue);}
h4{font-size:14.5px;margin:16px 0 7px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;
  margin-bottom:14px;box-shadow:var(--shadow);}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .55s cubic-bezier(.2,.7,.3,1),transform .55s cubic-bezier(.2,.7,.3,1);}
.reveal.in{opacity:1;transform:none;}
table{width:100%;border-collapse:collapse;font-size:13.8px;}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top;}
th{background:var(--soft);font-weight:600;}
tbody tr:hover{background:var(--soft);}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.t-ok{background:var(--teal-l);color:var(--teal);}
.t-warn{background:var(--amber-l);color:var(--amber);}
.t-info{background:var(--blue-l);color:var(--blue);}
.t-red{background:var(--red-l);color:var(--red);}
.t-p{background:var(--purple-l);color:var(--purple);}
ul,ol{padding-left:21px;margin:8px 0;} li{margin:5px 0;}
.note{background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--amber);
  border-radius:10px;padding:13px 16px;font-size:13.8px;margin:12px 0;}
.good{background:var(--teal-l);border-left:4px solid var(--teal);border-radius:10px;padding:13px 16px;font-size:13.8px;margin:12px 0;}
.warn{background:var(--red-l);border-left:4px solid var(--red);border-radius:10px;padding:13px 16px;font-size:13.8px;margin:12px 0;}
.quote{background:var(--soft);border-left:4px solid var(--blue);border-radius:8px;padding:12px 16px;font-size:13.8px;margin:10px 0;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.tab{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:9px;
  padding:7px 14px;font-size:13px;cursor:pointer;transition:.18s;font-family:inherit;}
.tab:hover{border-color:var(--blue);color:var(--blue);}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600;}
.pane{display:none;} .pane.on{display:block;animation:fade .35s;}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.chip{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:20px;
  padding:5px 13px;font-size:12.5px;cursor:pointer;transition:.18s;font-family:inherit;}
.chip:hover{border-color:var(--blue);color:var(--blue);}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600;}
.chip .c{opacity:.65;font-size:11px;margin-left:4px;}
input[type=text],select{border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:9px;padding:7px 12px;font-size:13px;font-family:inherit;outline:none;transition:.18s;}
input[type=text]:focus,select:focus{border-color:var(--blue);}
input[type=text]{min-width:190px;}
.bars{margin-top:6px;}
.brow{display:grid;grid-template-columns:118px 1fr 42px;gap:10px;align-items:center;
  margin:5px 0;font-size:12.8px;cursor:pointer;padding:2px 4px;border-radius:7px;transition:.15s;}
.brow:hover{background:var(--soft);}
.brow .lb{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
.brow .tr{height:20px;background:var(--line);border-radius:5px;overflow:hidden;}
.brow .fl{height:100%;width:0;border-radius:5px;transition:width .9s cubic-bezier(.2,.8,.3,1);}
.brow .vl{font-variant-numeric:tabular-nums;color:var(--sub);font-weight:600;font-size:12.5px;}
.plist{margin-top:4px;}
.pitem{border:1px solid var(--line);border-radius:11px;margin-bottom:7px;background:var(--card);overflow:hidden;transition:.18s;}
.pitem:hover{border-color:var(--blue);}
.phead{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 15px;cursor:pointer;}
.phead .nm{font-weight:700;font-size:14px;}
.phead .ad{font-size:12px;color:var(--mute);margin-top:1px;}
.phead .rt{display:flex;align-items:center;gap:10px;}
.phead .cnt{background:var(--blue-l);color:var(--blue);font-weight:700;font-size:12px;padding:3px 10px;border-radius:14px;white-space:nowrap;}
.phead .ar{color:var(--mute);font-size:11px;transition:transform .25s;}
.pitem.open .ar{transform:rotate(90deg);}
.pbody{display:none;padding:0 15px 14px;border-top:1px dashed var(--line);}
.pitem.open .pbody{display:block;animation:fade .3s;}
.pbody .meta{font-size:12px;color:var(--mute);padding-top:10px;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;}
.bchip{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:2px 9px;font-size:11.8px;color:var(--sub);}
.bchip.hl{background:var(--blue-l);border-color:var(--blue);color:var(--blue);font-weight:600;}
.statbar{display:flex;gap:18px;flex-wrap:wrap;padding:10px 14px;background:var(--soft);
  border:1px solid var(--line);border-radius:10px;margin-bottom:12px;font-size:13px;}
.statbar b{color:var(--blue);font-size:16px;}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 17px;
  cursor:pointer;transition:.2s;box-shadow:var(--shadow);}
.pcard:hover{border-color:var(--blue);transform:translateY(-2px);}
.pcard.open{border-color:var(--blue);background:var(--blue-l);}
.pcard .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.pcard .nm{font-weight:800;font-size:15.5px;}
.pcard .rl{font-size:12px;color:var(--sub);margin-top:2px;}
.pcard .fo{font-size:12.5px;color:var(--sub);margin-top:8px;}
.pcard .dt{display:none;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);font-size:13.3px;}
.pcard.open .dt{display:block;animation:fade .3s;}
.pcard .ar{color:var(--mute);font-size:13px;flex-shrink:0;}
.tl{position:relative;padding-left:28px;}
.tl::before{content:'';position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:var(--line);}
.tli{position:relative;margin-bottom:13px;}
.tli::before{content:'';position:absolute;left:-25px;top:7px;width:11px;height:11px;border-radius:50%;
  background:var(--card);border:2.5px solid var(--blue);}
.tli.key::before{background:var(--blue);box-shadow:0 0 0 3px var(--blue-l);}
.tli .y{font-weight:800;color:var(--blue);font-size:14.5px;}
.tli .c{font-size:13.5px;color:var(--sub);}
.aigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:13px;}
.aic{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 18px;
  box-shadow:var(--shadow);transition:.2s;border-top:4px solid var(--mute);}
.aic:hover{transform:translateY(-3px);}
.aic.p0{border-top-color:var(--red);} .aic.p1{border-top-color:var(--amber);}
.aic.p2{border-top-color:var(--blue);} .aic.p3{border-top-color:var(--purple);}
.aic .tt{font-weight:700;font-size:15px;margin:6px 0 8px;}
.aic .bd{font-size:13.3px;color:var(--sub);}
.aic .ft{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.3px;color:var(--mute);}
.aic .ft b{color:var(--ink);}
.ck{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:7px;background:var(--card);cursor:pointer;transition:.18s;}
.ck:hover{border-color:var(--purple);background:var(--soft);}
.ck.done{opacity:.55;}
.ck.done .qt{text-decoration:line-through;}
.ckbox{width:19px;height:19px;border:2px solid var(--line);border-radius:5px;flex-shrink:0;margin-top:2px;
  display:flex;align-items:center;justify-content:center;transition:.18s;}
.ck.done .ckbox{background:var(--teal);border-color:var(--teal);}
.ckbox::after{content:'✓';color:#fff;font-size:12px;font-weight:800;opacity:0;transition:.18s;}
.ck.done .ckbox::after{opacity:1;}
.qt{font-size:13.6px;}
.ckprog{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:13px;color:var(--sub);}
.ckprog .pb{flex:1;height:8px;background:var(--line);border-radius:5px;overflow:hidden;max-width:320px;}
.ckprog .pb i{display:block;height:100%;width:0;background:var(--teal);border-radius:5px;transition:width .4s;}
#top{position:fixed;right:24px;bottom:26px;width:44px;height:44px;border-radius:50%;
  background:var(--blue);color:#fff;border:none;font-size:19px;cursor:pointer;
  box-shadow:0 4px 16px rgba(24,95,165,.35);opacity:0;pointer-events:none;transition:.25s;z-index:900;}
#top.show{opacity:1;pointer-events:auto;}
.mobnav{display:none;}
@media (max-width:1040px){
  .layout{grid-template-columns:1fr;} .side{display:none;}
  .mobnav{display:block;position:sticky;top:0;z-index:800;background:var(--bg);
    border-bottom:1px solid var(--line);padding:10px 18px;overflow-x:auto;white-space:nowrap;}
  .mobnav a{display:inline-block;margin-right:6px;padding:5px 11px;border-radius:16px;
    background:var(--card);border:1px solid var(--line);color:var(--sub);text-decoration:none;font-size:12.5px;}
  .mobnav a.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  .main{padding:18px 18px 90px;} .kpis{grid-template-columns:repeat(2,1fr);} .grid2{grid-template-columns:1fr;}
  .hero{padding:26px 22px;} .hero h1{font-size:24px;}
  .brow{grid-template-columns:88px 1fr 38px;font-size:12px;}
}
@media print{
  .side,.mobnav,#top,.tools,.filters,.tabs,#prog{display:none!important;}
  .layout{grid-template-columns:1fr;} .reveal{opacity:1!important;transform:none!important;}
  .pane{display:block!important;} .pbody,.pcard .dt{display:block!important;}
  body{background:#fff;} .card,.aic,.pcard{box-shadow:none;break-inside:avoid;}
}
</style>
</head>
<body>
<div id="prog"></div>
<button id="top" title="回到顶部">↑</button>

<div class="layout">
  <aside class="side">
    <div class="brand" id="sideBrand"></div>
    <nav id="nav"></nav>
    <div class="tools">
      <button class="btn" id="themeBtn">🌗 主题</button>
      <button class="btn" id="printBtn">🖨 打印</button>
    </div>
    <div style="margin-top:16px;font-size:11px;color:var(--mute);line-height:1.6;" id="sideMeta"></div>

  <main class="main">

    <section id="s1" class="reveal"><h2></h2><div id="sec1"></div></section>
    <section id="s2" class="reveal"><h2></h2><div id="sec2"></div></section>
    <section id="s3" class="reveal"><h2></h2><div id="sec3"></div></section>
    <section id="s4" class="reveal"><h2></h2><div id="sec4"></div></section>
    <section id="s5" class="reveal"><h2></h2><div id="sec5"></div></section>
    <section id="s6" class="reveal"><h2></h2><div id="sec6"></div></section>

<script>
/* =========================================================================

  {n:"信息管理部 / IT 负责人", r:"技术与数据条线", g:"业务对口", f:"系统稳定、数据安全、自有掌控力",

const BIZ = [

function countUp(el){
  const t=parseFloat(el.dataset.t), dec=t%1!==0, dur=1100, st=performance.now();
  (function step(now){
    const p=Math.min((now-st)/dur,1), e=1-Math.pow(1-p,3), v=t*e;
    el.textContent = dec ? v.toFixed(1) : Math.round(v);
    if(p<1) requestAnimationFrame(step);
  })(st);
}

const PRIOS=["全部","P0","P1","P2","P3"];
if(AI.length){
  $("#s10 h2").innerHTML=`10 · ${CFG.labels.ai} <span class="num">${CFG.labels.aiNum}</span>`;
  const renderAI=(p)=>{
    const list = p==="全部"?AI:AI.filter(a=>a.p===p);
    $("#sec10").innerHTML=`<div class="filters">${PRIOS.map(x=>
      `<button class="chip${x===p?" on":""}" data-p="${x}">${x}<span class="c">${
        x==="全部"?AI.length:AI.filter(a=>a.p===x).length}</span></button>`).join("")}</div>
      <div class="aigrid">${list.map(a=>`<div class="aic ${a.p.toLowerCase()}">
        <div><span class="tag ${a.p==="P0"?"t-red":a.p==="P1"?"t-warn":a.p==="P2"?"t-info":"t-p"}">${a.p}</span>
        ${a.hl?`<span class="tag t-red" style="margin-left:4px">${a.hl}</span>`:""}</div>
        <div class="tt">${a.t}</div><div class="bd">${a.b}</div>
        <div class="ft"><b>对口：</b>${a.o}<br><b>指标：</b>${a.m}</div></div>`).join("")}</div>`;
    $$("#sec10 .chip").forEach(c=>c.onclick=()=>renderAI(c.dataset.p));
  };
  renderAI("全部");
} else $("#s10").style.display="none";

/* ---- s11 沟通策略 + 清单 ---- */
if(STATIC.communication || QUESTIONS.length){
  $("#s11 h2").innerHTML=`11 · 沟通策略 <span class="num">分角色话术 + 破冰问题清单</span>`;
  const CK="crr_checklist_v1";
  let ckd=JSON.parse(localStorage.getItem(CK)||"[]");
  const renderCK=()=>{
    $("#ckList").innerHTML=QUESTIONS.map((q,i)=>`
      <div class="ck${ckd.includes(i)?" done":""}" data-i="${i}">
        <div class="ckbox"></div><div class="qt"><b>Q${i+1}.</b> ${q}</div></div>`).join("");
    $$("#ckList .ck").forEach(c=>c.onclick=()=>{
      const i=+c.dataset.i, k=ckd.indexOf(i);
      if(k>-1) ckd.splice(k,1); else ckd.push(i);
      localStorage.setItem(CK,JSON.stringify(ckd)); renderCK();
    });
    $("#ckN").textContent=ckd.length;
    $("#ckBar").style.width=(ckd.length/QUESTIONS.length*100)+"%";
  };
  $("#sec11").innerHTML=`<div class="card">${STATIC.communication}</div>
    <div class="card"><h3 style="margin-top:0">破冰提问清单 <span class="tag t-p">点击勾选 · 自动保存</span></h3>
    <div class="ckprog"><span>已记录：<b id="ckN">0</b>/${QUESTIONS.length}</span>
      <div class="pb"><i id="ckBar"></i></div><button class="btn" id="ckClear">清空</button></div>
    <div id="ckList"></div>
    <p style="font-size:12.5px;color:var(--mute);margin-top:12px;">把对话从「AI 能做什么」切换到「您的业务卡在哪里」。对方每回答一个问题，就等于为你免费做了一次需求调研。</p></div>`;
  renderCK();
  $("#ckClear").onclick=()=>{ckd=[];localStorage.setItem(CK,"[]");renderCK();};
} else $("#s11").style.display="none";

fill("s12","12 · 风险提示","数据口径差异与注意事项",`<div class="card">${STATIC.risk}</div>
  <div style="margin-top:24px;padding-top:18px;border-top:1px solid var(--line);font-size:12.3px;color:var(--mute);">
    <strong>${CFG.company} 交互式研究报告</strong>　｜　调研完成：${CFG.date}　｜　用途：AI 应用落地前期调研与客户高层沟通底稿<br>
    标注「实测」的数据取自官方接口；「第三方口径」仅供内部参考，对外沟通请以官网及对方自述为准。</div>`);

/* ---- 导航：按可见章节生成 ---- */
const NAMES={s1:"企业速览",s2:CFG.labels.timeline,s3:CFG.labels.people,s4:CFG.labels.biz,
  s5:CFG.labels.datasetA,s6:CFG.labels.datasetB,s7:"文化与人才",s8:"数字化诊断",
  s9:"战略重心",s10:"AI 机会地图",s11:"沟通策略",s12:"风险提示"};
const visible=$$("main section").filter(s=>s.style.display!=="none");
$("#nav").innerHTML=visible.map((s,i)=>
  `<a href="#${s.id}"><i>${String(i+1).padStart(2,"0")}</i>${NAMES[s.id]||s.id}</a>`).join("");
$("#mnav").innerHTML=visible.map(s=>`<a href="#${s.id}">${NAMES[s.id]||s.id}</a>`).join("");
const navA=$$("#nav a"), mnavA=$$("#mnav a");

/* ---- 滚动行为 ---- */
const io=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); $$("#kpis .cu").forEach(countUp); } });
},{threshold:.08});
$$(".reveal").forEach(s=>io.observe(s));

const io2=new IntersectionObserver(es=>{
  es.forEach(e=>{
    if(!e.isIntersecting) return;
    const id=e.target.id;
    navA.forEach(a=>a.classList.toggle("on", a.getAttribute("href")==="#"+id));
    mnavA.forEach(a=>a.classList.toggle("on", a.getAttribute("href")==="#"+id));
  });
},{rootMargin:"-15% 0px -70% 0px"});
visible.forEach(s=>io2.observe(s));

addEventListener("scroll",()=>{
  const h=document.documentElement;
  $("#prog").style.width = h.scrollTop/(h.scrollHeight-h.clientHeight)*100+"%";
  $("#top").classList.toggle("show", h.scrollTop>500);
},{passive:true});
$("#top").onclick=()=>scrollTo({top:0,behavior:"smooth"});

document.addEventListener("click",e=>{
  const a=e.target.closest('a[href^="#"]');
  if(a){ e.preventDefault(); const t=$(a.getAttribute("href"));
    if(t && t.style.display!=="none") t.scrollIntoView({behavior:"smooth",block:"start"}); }
});

$("#themeBtn").onclick=()=>{
  const d=document.documentElement.dataset.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=d; localStorage.setItem("crr_theme",d);
};
if(localStorage.getItem("crr_theme")) document.documentElement.dataset.theme=localStorage.getItem("crr_theme");
$("#printBtn").onclick=()=>print();
</script>
</body>
</html>
